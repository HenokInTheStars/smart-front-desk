name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Runs alongside the job, reachable at localhost from these steps —
    # unlike docker-compose.yml, GitHub Actions job steps run directly on
    # the runner, not inside a container, so "postgres" as a hostname would
    # NOT work here. localhost is correct in this file specifically.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://frontdesk:frontdesk@localhost:5432/frontdesk
      JWT_SECRET: ci-test-secret-not-for-production
      FRONTEND_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests
        run: pytest

      - name: Alembic migration dry-run
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
