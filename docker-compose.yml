# docker-compose.yml
services:
  postgres:
    image: pgvector/pgvector:pg16 # Postgres 16 with pgvector preinstalled
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
      POSTGRES_DB: frontdesk
    ports: [ "5433:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql # extensions on first boot
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U frontdesk" ]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: [ "8000:8000" ]
    env_file: ./backend/.env
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [ "./backend:/app" ]

  frontend:
    build: ./frontend
    command: npm run dev
    ports: [ "3000:3000" ]
    env_file: ./frontend/.env.local
    depends_on: [ backend ]
    volumes: [ "./frontend:/app", "/app/node_modules" ]

volumes:
  pgdata:
